# GitHub Metrics for KR
# You probably won't check this.
#
# Remove things to remove it from the widget.
# Just check the following configuration to add stuff.
# https://github.com/lowlighter/metrics/blob/master/action.yml

# Doesn't lag my PC browser, does lag the browser in the XPS.

# No, nothing is wrong here. Set up your metrics token.

name: GitHub Metrics (Hello KR)
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: abdelaziz-mahdy
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          base_hireable: yes
          repositories: 300
          #   config_timezone: Asia/Kathmandu
          # achievements plugin disabled: it queries the Projects (classic)
          # GraphQL API which GitHub removed, so it always errors now.
          plugin_achievements: no

          plugin_activity: yes
          plugin_activity_days: 14
          # "push" excluded: GitHub events API can return PushEvents without a
          # commits array, which crashes the plugin (upstream bug, unmaintained)
          plugin_activity_filter: comment, ref/create, ref/delete, release, issue, pr, review, wiki, fork, star, member, public
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: public # all

          plugin_followup: yes
          plugin_followup_sections: user # repositories
          # plugin_followup_indepth: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: TeX, HTML, Jupyter, Jupyter Notebook, C++ , JavaScript
          plugin_languages_limit: 14
          # "recently-used" section removed: its analyzer crashes with
          # "Cannot destructure property 'committer' of 'undefined'"
          # (upstream bug in lowlighter/metrics recent.mjs, project unmaintained)
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          # plugin_languages_indepth: false

          plugin_reactions: yes
          plugin_reactions_details: count
          plugin_reactions_limit: 200

          plugin_lines: yes

          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 38
          plugin_people_types: followers, following

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_leetcode: yes
          plugin_leetcode_user: abdelaziz-mahdy
          plugin_leetcode_sections: solved, skills #, recent

# Again, nothing is wrong here. It takes time to run the actions.
